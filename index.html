<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright Cafe - مینیو</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #FFF8DC;
            color: #4A2C2A;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            margin: 30px auto;
            background: #FFFFFF;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 2px solid #8B4513;
        }
        h1 {
            background-color: #5C3317;
            color: #FFFFFF;
            padding: 15px;
            border-radius: 10px;
            margin-top: 0;
        }
        .open-link {
            display: inline-block;
            margin: 15px 0;
            color: #0066CC;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
        }
        #menu-panel {
            display: none;
            text-align: right;
            margin-top: 20px;
            border-top: 1px dashed #8B4513;
            padding-top: 15px;
        }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0e6d6;
            font-size: 16px;
        }
        input[type="number"] {
            width: 50px;
            padding: 5px;
            text-align: center;
            border: 1px solid #8B4513;
            border-radius: 5px;
        }
        button {
            width: 100%;
            background-color: #8B4513;
            color: white;
            border: none;
            padding: 12px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #5C3317;
        }
        #total-display {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            color: #2E7D32;
        }
        #receipt {
            display: none;
            background-color: #FAF0E6;
            border: 1px dashed #8B4513;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            white-space: pre-line;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>(BrightCafe)</h1>
    <div class="open-link" onclick="showMenu()">کلیک لێرە بکە بۆ کردنەوەی مینیو</div>

    <div id="menu-panel">
        <div class="item">
            <label><input type="checkbox" id="c1"> ئیسپرێسۆ - ٢٥٠٠</label>
            <input type="number" id="q1" value="1" min="1">
        </div>
        <div class="item">
            <label><input type="checkbox" id="c2"> ئەمریکانۆ - ٣٠٠٠</label>
            <input type="number" id="q2" value="1" min="1">
        </div>
        <div class="item">
            <label><input type="checkbox" id="c3"> قاوەی تورکی - ٤٠٠٠</label>
            <input type="number" id="q3" value="1" min="1">
        </div>
        <div class="item">
            <label><input type="checkbox" id="c4"> قاوەی قەزوان - ٤٠٠٠</label>
            <input type="number" id="q4" value="1" min="1">
        </div>
        <div class="item">
            <label><input type="checkbox" id="c5"> لاتێ - ٤٠٠٠</label>
            <input type="number" id="q5" value="1" min="1">
        </div>

        <button onclick="calculate()">حسابکردن</button>
        <div id="total-display">کۆی گشتی: 0 دینار</div>
        <div id="receipt"></div>
    </div>
</div>

<script>
    function showMenu() {
        document.getElementById("menu-panel").style.display = "block";
    }

    function calculate() {
        let total = 0;
        let receiptText = "=== پسوڵەی بڕایت کافێ ===\n\n";

        const items = [
            { id: "c1", qtyId: "q1", name: "ئیسپرێسۆ", price: 2500 },
            { id: "c2", qtyId: "q2", name: "ئەمریکانۆ", price: 3000 },
            { id: "c3", qtyId: "q3", name: "قاوەی تورکی", price: 4000 },
            { id: "c4", qtyId: "q4", name: "قاوەی قەزوان", price: 4000 },
            { id: "c5", qtyId: "q5", name: "لاتێ", price: 4000 }
        ];

        items.forEach(item => {
            if (document.getElementById(item.id).checked) {
                let qty = parseInt(document.getElementById(item.qtyId).value) || 1;
                let cost = item.price * qty;
                total += cost;
                receiptText += `• ${item.name} (x${qty}) : ${cost} دینار\n`;
            }
        });

        document.getElementById("total-display").innerText = "کۆی گشتی: " + total + " دینار";
        const receiptBox = document.getElementById("receipt");

        if (total > 0) {
            receiptText += "\n------------------------\n";
            receiptText += `کۆی گشتی پارە: ${total} دینار\nسوپاس بۆ سەردانەکەت!`;
            receiptBox.innerText = receiptText;
            receiptBox.style.display = "block";
        } else {
            receiptBox.style.display = "none";
            alert("تکایە سەرەتا جۆرێک قاوە هەڵبژێرە!");
        }
    }
</script>

</body>
</html>
